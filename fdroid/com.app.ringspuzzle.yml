AutoName: 2D Cube Puzzle
Summary: The whole Rubik's Cube in 2D — spin 9 rings, sort 54 dots, solve it
Description: |
  The whole Rubik's Cube, flattened into 2D.

  54 coloured dots sit on 9 overlapping circles — the exact diagram of a cube's moves. Tap a circle to turn it, just like turning a face of the cube. Sort every dot back into its colour group to solve it.

  Tap any circle to turn it (Forward / Prime switch sets the direction). Scramble deals a fresh puzzle — pick a Level, and a Difficulty (Beginner, Smart, Pro) to shuffle harder. Undo a move, or ask for a Hint that points at the next move back to solved. Hints are limited per game. Moves counter and timer start on your first move. Best time and best moves are saved on your phone, per level.

  Settings lets you change the dot colours (8 themes), make the dots glow, turn all rings one way, or hide the timer. How to play explains the rules and what every move letter means.

  No ads. No sign-in. No internet. No permissions. Fully offline — just you and the puzzle.

